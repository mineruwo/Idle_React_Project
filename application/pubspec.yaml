name: application
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.9.2

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    portone_flutter: ^0.12.1
    http: ^1.2.1
    intl: ^0.20.2
    dio: ^5.4.0
